name: Update Guild Rosters

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run guild rosters update
        run: npm run update:guild-rosters

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nostalgia_players.json data/character-guilds.json data/*_players.json
          git diff --cached --quiet || git commit -m "chore: update guild rosters"
          git pull --rebase --autostash origin main
          git push
